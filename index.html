<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b86f7e">
<title>Rose Garden Colors</title>
<style>
:root{--bg:#f7f1ee;--card:#fffdfa;--ink:#2f2927;--muted:#81736f;--line:#eaded8;--accent:#b86f7e;--soft:#f1dde2;--green:#4f9c70;--orange:#d7763f;--red:#c95454}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbf8f6,#f5eeea);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 100px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{margin:0;font-size:25px}.sub,.muted{color:var(--muted);font-size:13px}
.avatar{width:44px;height:44px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.search{display:flex;gap:8px;align-items:center;background:white;border:1px solid var(--line);border-radius:18px;padding:11px 12px}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent}.btn{border:0;background:var(--accent);color:white;border-radius:14px;padding:11px 13px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{font-size:22px;display:block}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{border:1px solid var(--line);background:white;border-radius:18px;padding:15px;text-align:left}.action b{display:block;margin-top:5px}.action small{color:var(--muted)}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2{font-size:16px;margin:0}.link{border:0;background:transparent;color:var(--accent);font-weight:800}
.list{display:flex;flex-direction:column;gap:10px}.card{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:19px;padding:12px}
.swatch{width:58px;height:58px;border-radius:17px;border:1px solid rgba(0,0,0,.08);object-fit:cover;background:#ddd}.meta b{display:block;font-size:15px}.meta small{display:block;color:var(--muted);margin-top:3px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#f1ebe8}.ok{background:#e6f4ea;color:#267648}.warn{background:#fff0dd;color:#9d5926}.bad{background:#fde7e7;color:#a53e3e}
.chev{font-size:24px;color:#b7aaa5}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:18px}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(528px,calc(100% - 24px));background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:21px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav{border:0;background:transparent;border-radius:14px;padding:9px 4px;color:var(--muted);font-size:11px}.nav.active{background:var(--soft);color:#7d4050;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(42,33,30,.45);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:30}.sheet{width:min(560px,100%);background:#fffaf7;border-radius:27px 27px 18px 18px;padding:18px;max-height:90vh;overflow:auto}
.handle{width:48px;height:5px;background:#ddd0ca;border-radius:999px;margin:0 auto 16px}.sheet h3{margin:0 0 5px;font-size:21px}.sheet p{margin:0 0 14px;color:var(--muted);font-size:13px}
.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:11px 12px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;background:var(--accent);color:white;border-radius:15px;padding:13px;font-weight:850;margin-top:11px}.secondary{width:100%;border:1px solid var(--line);background:white;border-radius:15px;padding:12px;font-weight:750;margin-top:8px}
.auth{max-width:430px;margin:45px auto;background:white;border:1px solid var(--line);border-radius:24px;padding:22px}.auth h2{margin-top:0}.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.authTabs button{border:1px solid var(--line);background:white;border-radius:12px;padding:9px}.authTabs .active{background:var(--soft)}
.detailRow{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.detailRow span:first-child{color:var(--muted)}.statusGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.statusGrid button{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 3px;font-size:12px}
.camBox{border:2px dashed #d7c3be;border-radius:22px;padding:18px;text-align:center;background:#fffdfc}.preview{width:100%;max-height:240px;object-fit:contain;border-radius:16px;margin-top:10px;display:none}.ocr{background:#f8efec;border-radius:16px;padding:12px;margin-top:12px;font-size:13px;white-space:pre-wrap}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{border:1px solid var(--line);background:white;border-radius:12px;padding:8px 10px;font-size:12px}
</style>
</head>
<body>
<div id="authView" class="auth">
  <h2>Rose Garden Colors 💅</h2>
  <p class="muted">登录以后，手机、iPad、电脑都会同步同一套颜色库存。</p>
  <div class="authTabs">
    <button id="loginTab" class="active" onclick="setAuthMode('login')">登录</button>
    <button id="signupTab" onclick="setAuthMode('signup')">第一次注册</button>
  </div>
  <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="至少 6 位"></div>
  <button class="primary" id="authBtn" onclick="submitAuth()">登录</button>
  <p id="authMsg" class="muted" style="margin-top:10px"></p>
</div>

<div id="mainView" class="app" style="display:none">
  <div class="header">
    <div><h1>Rose Garden Colors</h1><div class="sub" id="userLine"></div></div>
    <div class="avatar">💅</div>
  </div>
  <div class="topline" style="margin-bottom:10px">
    <div class="muted">☁️ Cloud Sync</div>
    <button class="logout" onclick="logout()">Log out</button>
  </div>

  <div class="search"><span>🔎</span><input id="search" placeholder="搜色号、名字、品牌…"><button class="btn" onclick="openAdd(true)">📷</button></div>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span class="muted">Total Colors</span></div>
    <div class="stat"><b id="sLow">0</b><span class="muted">Low Stock</span></div>
    <div class="stat"><b id="sOut">0</b><span class="muted">Out of Stock</span></div>
    <div class="stat"><b id="sMissing">0</b><span class="muted">Missing Match</span></div>
  </div>

  <div class="actions">
    <button class="action" onclick="openAdd(true)">📷<b>Scan Color</b><small>拍瓶身识别文字</small></button>
    <button class="action" onclick="showShopping()">🛒<b>Shopping List</b><small>Low + Out 自动汇总</small></button>
    <button class="action" onclick="setFilter('missing')">🔗<b>Missing Match</b><small>缺 Gel / Regular</small></button>
    <button class="action" onclick="openAdd(false)">➕<b>Add Color</b><small>手动添加颜色</small></button>
  </div>

  <div class="section"><h2 id="sectionTitle">All Colors</h2><button class="link" onclick="setFilter('all')">View all</button></div>
  <div id="list" class="list"></div>
</div>

<div class="bottom" id="bottomNav" style="display:none">
  <button class="nav active" onclick="setFilter('all')">🏠<br>Home</button>
  <button class="nav" onclick="setFilter('all')">🎨<br>Colors</button>
  <button class="nav" onclick="showShopping()">🛒<br>Buy</button>
  <button class="nav" onclick="openAdd(true)">📷<br>Scan</button>
</div>

<div class="modal" id="addModal"><div class="sheet">
<div class="handle"></div><h3 id="addTitle">Add Color</h3>
<div class="camBox" id="camBox">
  <div style="font-size:38px">📸</div><b>拍瓶身 / 上传照片</b>
  <p class="muted">识别后请检查品牌、色号和颜色名。</p>
  <input id="photoInput" type="file" accept="image/*" capture="environment">
  <img id="photoPreview" class="preview"><div id="ocrStatus" class="ocr" style="display:none"></div>
</div>
<div class="grid2"><div class="field"><label>Brand</label><input id="fBrand"></div><div class="field"><label>Color Number</label><input id="fNum"></div></div>
<div class="field"><label>Color Name</label><input id="fName"></div>
<div class="grid2">
<div class="field"><label>Gel Stock</label><select id="fGel"><option>Plenty</option><option>Half</option><option>Low</option><option>Out</option><option>Not Available</option></select></div>
<div class="field"><label>Regular Stock</label><select id="fRegular"><option>Plenty</option><option>Half</option><option>Low</option><option>Out</option><option>Not Available</option></select></div>
</div>
<div class="grid2"><div class="field"><label>Color Book / Position</label><input id="fBook"></div><div class="field"><label>Replacement</label><input id="fReplacement"></div></div>
<div class="field"><label>Notes</label><textarea id="fNotes" rows="2"></textarea></div>
<button class="primary" onclick="saveColor()">✓ Save to Cloud</button><button class="secondary" onclick="closeModal('addModal')">Cancel</button>
</div></div>

<div class="modal" id="detailModal"><div class="sheet"><div class="handle"></div><div id="detail"></div></div></div>
<div class="modal" id="shopModal"><div class="sheet"><div class="handle"></div><h3>🛒 Shopping List</h3><p>Low + Out 自动汇总。</p><div id="shopList"></div><button class="secondary" onclick="closeModal('shopModal')">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const SUPABASE_URL = 'https://yizjxeffmdtxsjmxpscx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sjErGkhCNybndSplIJ3tDg_55KyH9CY';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let colors=[], currentUser=null, filter='all', editingId=null, currentPhotoUrl='', currentPhotoFile=null, authMode='login';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function isMissing(c){return c.gel_stock==='Not Available'||c.regular_stock==='Not Available'}
function isLow(c){return c.gel_stock==='Low'||c.regular_stock==='Low'}
function isOut(c){return c.gel_stock==='Out'||c.regular_stock==='Out'}
function closeModal(id){document.getElementById(id).style.display='none'}
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.style.display='none'});

function setAuthMode(mode){
 authMode=mode; document.getElementById('loginTab').classList.toggle('active',mode==='login'); document.getElementById('signupTab').classList.toggle('active',mode==='signup');
 document.getElementById('authBtn').textContent=mode==='login'?'登录':'创建账号';
}
async function submitAuth(){
 const email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPassword').value;
 const msg=document.getElementById('authMsg'); msg.textContent='处理中…';
 let res;
 if(authMode==='signup') res=await sb.auth.signUp({email,password});
 else res=await sb.auth.signInWithPassword({email,password});
 if(res.error){msg.textContent=res.error.message;return}
 if(authMode==='signup'&&!res.data.session){msg.textContent='账号已建立。请去邮箱点确认链接，然后回来登录。';return}
 msg.textContent='成功';
}
async function logout(){await sb.auth.signOut()}

async function loadColors(){
 const {data,error}=await sb.from('colors').select('*').order('created_at',{ascending:false});
 if(error){document.getElementById('list').innerHTML='<div class="empty">数据库还没设置好：'+esc(error.message)+'</div>';return}
 colors=data||[]; render();
}
function render(){
 document.getElementById('sTotal').textContent=colors.length;
 document.getElementById('sLow').textContent=colors.filter(isLow).length;
 document.getElementById('sOut').textContent=colors.filter(isOut).length;
 document.getElementById('sMissing').textContent=colors.filter(isMissing).length;
 const q=(document.getElementById('search').value||'').toLowerCase().trim();
 let arr=colors.filter(c=>[c.brand,c.color_number,c.color_name,c.color_book,c.replacement,c.notes].join(' ').toLowerCase().includes(q));
 if(filter==='missing')arr=arr.filter(isMissing);
 document.getElementById('sectionTitle').textContent=filter==='missing'?'Missing Match':'All Colors';
 document.getElementById('list').innerHTML=arr.length?arr.map(c=>`
 <div class="card" onclick="openDetail('${c.id}')">
   ${c.photo_url?`<img class="swatch" src="${esc(c.photo_url)}">`:`<div class="swatch"></div>`}
   <div class="meta"><b>${esc(c.brand)} #${esc(c.color_number)} · ${esc(c.color_name)}</b>
   <small>Gel: ${esc(c.gel_stock)} · Regular: ${esc(c.regular_stock)}</small>
   <div class="badges"><span class="badge ${isMissing(c)?'bad':'ok'}">${isMissing(c)?'Missing Match':'Matching ✓'}</span>${isLow(c)?'<span class="badge warn">Low Stock</span>':''}${isOut(c)?'<span class="badge bad">Out</span>':''}</div></div>
   <div class="chev">›</div></div>`).join(''):'<div class="empty">没有找到颜色</div>';
}
document.getElementById('search').addEventListener('input',render);
function setFilter(f){filter=f;render();window.scrollTo({top:250,behavior:'smooth'})}

function clearForm(){
 ['fBrand','fNum','fName','fBook','fReplacement','fNotes'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('fGel').value='Plenty';document.getElementById('fRegular').value='Plenty';
 editingId=null;currentPhotoUrl='';currentPhotoFile=null;
 document.getElementById('photoPreview').style.display='none';document.getElementById('photoInput').value='';document.getElementById('ocrStatus').style.display='none';
}
function openAdd(scan){clearForm();document.getElementById('addTitle').textContent=scan?'📷 Scan Color':'➕ Add Color';document.getElementById('camBox').style.display=scan?'block':'none';document.getElementById('addModal').style.display='flex'}
function editColor(id){
 const c=colors.find(x=>x.id===id); if(!c)return; clearForm(); editingId=id;
 document.getElementById('fBrand').value=c.brand;document.getElementById('fNum').value=c.color_number;document.getElementById('fName').value=c.color_name;
 document.getElementById('fGel').value=c.gel_stock;document.getElementById('fRegular').value=c.regular_stock;document.getElementById('fBook').value=c.color_book||'';
 document.getElementById('fReplacement').value=c.replacement||'';document.getElementById('fNotes').value=c.notes||'';currentPhotoUrl=c.photo_url||'';
 if(currentPhotoUrl){let p=document.getElementById('photoPreview');p.src=currentPhotoUrl;p.style.display='block'}
 closeModal('detailModal');document.getElementById('addModal').style.display='flex';
}
async function uploadPhoto(){
 if(!currentPhotoFile)return currentPhotoUrl||null;
 const ext=(currentPhotoFile.name.split('.').pop()||'jpg').toLowerCase(); const path=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;
 const {error}=await sb.storage.from('color-photos').upload(path,currentPhotoFile,{upsert:false});
 if(error)throw error;
 const {data}=sb.storage.from('color-photos').getPublicUrl(path); return data.publicUrl;
}
async function saveColor(){
 const brand=document.getElementById('fBrand').value.trim(), num=document.getElementById('fNum').value.trim(), name=document.getElementById('fName').value.trim();
 if(!brand||!num||!name){alert('Brand、Color Number、Color Name 要填完整。');return}
 try{
  const photo_url=await uploadPhoto();
  const payload={user_id:currentUser.id,brand,color_number:num,color_name:name,gel_stock:document.getElementById('fGel').value,regular_stock:document.getElementById('fRegular').value,
  color_book:document.getElementById('fBook').value.trim(),replacement:document.getElementById('fReplacement').value.trim(),notes:document.getElementById('fNotes').value.trim(),photo_url};
  let res=editingId?await sb.from('colors').update(payload).eq('id',editingId):await sb.from('colors').insert(payload);
  if(res.error)throw res.error; closeModal('addModal'); await loadColors();
 }catch(e){alert('保存失败：'+e.message)}
}
function openDetail(id){
 const c=colors.find(x=>x.id===id); if(!c)return;
 document.getElementById('detail').innerHTML=`<h3>${esc(c.color_name)}</h3><p>${esc(c.brand)} · #${esc(c.color_number)}</p>
 ${c.photo_url?`<img class="preview" style="display:block" src="${esc(c.photo_url)}">`:''}
 <div class="detailRow"><span>Gel</span><b>${esc(c.gel_stock)}</b></div><div class="detailRow"><span>Regular</span><b>${esc(c.regular_stock)}</b></div>
 <div class="detailRow"><span>Color Book</span><b>${esc(c.color_book||'—')}</b></div><div class="detailRow"><span>Replacement</span><b>${esc(c.replacement||'—')}</b></div>
 <div style="margin-top:12px;font-weight:800">Gel 快速库存</div><div class="statusGrid">${['Plenty','Half','Low','Out'].map(s=>`<button onclick="quickStatus('${c.id}','gel_stock','${s}')">${s}</button>`).join('')}</div>
 <div style="margin-top:12px;font-weight:800">Regular 快速库存</div><div class="statusGrid">${['Plenty','Half','Low','Out'].map(s=>`<button onclick="quickStatus('${c.id}','regular_stock','${s}')">${s}</button>`).join('')}</div>
 <button class="primary" onclick="editColor('${c.id}')">Edit Color</button><button class="secondary" onclick="deleteColor('${c.id}')">Delete</button><button class="secondary" onclick="closeModal('detailModal')">Close</button>`;
 document.getElementById('detailModal').style.display='flex';
}
async function quickStatus(id,key,val){const {error}=await sb.from('colors').update({[key]:val}).eq('id',id);if(error)alert(error.message);else{await loadColors();openDetail(id)}}
async function deleteColor(id){if(!confirm('确定删除吗？'))return;const {error}=await sb.from('colors').delete().eq('id',id);if(error)alert(error.message);else{closeModal('detailModal');await loadColors()}}
function showShopping(){
 const arr=colors.filter(c=>isLow(c)||isOut(c));
 document.getElementById('shopList').innerHTML=arr.length?arr.map(c=>`<div class="detailRow"><span><b>${esc(c.brand)} #${esc(c.color_number)}</b><br>${esc(c.color_name)}</span><b>${c.gel_stock==='Low'||c.gel_stock==='Out'?'Gel '+c.gel_stock:''}${(c.gel_stock==='Low'||c.gel_stock==='Out')&&(c.regular_stock==='Low'||c.regular_stock==='Out')?'<br>':''}${c.regular_stock==='Low'||c.regular_stock==='Out'?'Regular '+c.regular_stock:''}</b></div>`).join(''):'<div class="empty">现在没有需要补货的颜色 🎉</div>';
 document.getElementById('shopModal').style.display='flex';
}
document.getElementById('photoInput').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;currentPhotoFile=file;
 const reader=new FileReader();reader.onload=async ev=>{let img=document.getElementById('photoPreview');img.src=ev.target.result;img.style.display='block';let st=document.getElementById('ocrStatus');st.style.display='block';st.textContent='正在识别…';
 try{const r=await Tesseract.recognize(ev.target.result,'eng',{logger:m=>{if(m.status==='recognizing text')st.textContent='正在识别… '+Math.round((m.progress||0)*100)+'%'}});let t=(r.data.text||'').trim();st.textContent='识别到：\n'+(t||'没有识别到清晰文字');autofill(t)}catch(err){st.textContent='识别失败，可以手动输入。'}};reader.readAsDataURL(file);
});
function autofill(text){const clean=text.replace(/\s+/g,' ').trim(),up=clean.toUpperCase();const brands=['DND','OPI','GELISH','KIARA SKY','APRES','CND','ESSIE'];const b=brands.find(x=>up.includes(x));if(b)document.getElementById('fBrand').value=b;const m=clean.match(/(?:#\s*)?([A-Z]?\d{2,4}[A-Z]?)/i);if(m)document.getElementById('fNum').value=m[1];}

sb.auth.onAuthStateChange(async(event,session)=>{
 currentUser=session?.user||null;
 document.getElementById('authView').style.display=currentUser?'none':'block';
 document.getElementById('mainView').style.display=currentUser?'block':'none';
 document.getElementById('bottomNav').style.display=currentUser?'grid':'none';
 if(currentUser){document.getElementById('userLine').textContent=currentUser.email+' · 已同步';await loadColors()}else colors=[];
});
(async()=>{const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;if(currentUser){document.getElementById('authView').style.display='none';document.getElementById('mainView').style.display='block';document.getElementById('bottomNav').style.display='grid';document.getElementById('userLine').textContent=currentUser.email+' · 已同步';await loadColors()}})();
</script>
</body>
</html>
